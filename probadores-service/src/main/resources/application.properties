spring.application.name=probadores-service
server.port=8081

# ${DB_HOST:localhost}: en local usa localhost; en Docker se le pasa DB_HOST=mysql.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/rinconsur_probadores?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
