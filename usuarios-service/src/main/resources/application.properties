spring.application.name=usuarios-service
server.port=8083

# Base de datos propia de este servicio (MySQL de Laragon o XAMPP, usuario root sin clave).
# ${DB_HOST:localhost}: en local usa localhost; en Docker se le pasa DB_HOST=mysql.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/rinconsur_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.error.include-message=always
# Respeta los encabezados X-Forwarded del Gateway (Swagger arma bien las URL).
server.forward-headers-strategy=framework

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
